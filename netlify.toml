[build]
  publish = "build"

[[redirects]]
  from = "/sitemap-aigo.xml"
  to = "/sitemap-aigo.xml"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sitemap-aigo.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=0"